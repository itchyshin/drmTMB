url: https://itchyshin.github.io/drmTMB/
destination: pkgdown-site
template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    before_navbar: '<span class="drmtmb-version-note">0.6.0 experimental</span>'
  bslib:
    primary: "#0f7887"
    headings-color: "#112638"
    link-color: "#0f7887"
  opengraph:
    image:
      src: man/figures/drmTMB-logo.png
      alt: "drmTMB hex logo"

development:
  mode: default

redirects:
  - ["ROADMAP.html", "articles/capability-and-limits.html"]

navbar:
  structure:
    left: [intro, reference, model_guides, tutorials, diagnostics, developer, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      menu:
        - text: Overview and first model
          href: articles/drmTMB.html
        - text: Can I fit and report this?
          href: articles/capability-and-limits.html
        - text: Choose a family
          href: articles/distribution-families.html
        - text: Model map
          href: articles/model-map.html
        - text: Check and report a fitted model
          href: articles/model-workflow.html
    model_guides:
      text: Model Guides
      menu:
        - text: What can I fit today?
          href: articles/model-map.html
        - text: Detailed implementation status
          href: articles/implementation-map.html
        - text: Which scale are you modelling?
          href: articles/which-scale.html
        - text: Choosing response families
          href: articles/distribution-families.html
        - text: Model selection with AIC and BIC
          href: articles/model-selection.html
        - text: Handling missing data
          href: articles/missing-data.html
        - text: Residual correlation with rho12
          href: articles/bivariate-coscale.html
        - text: Joint and staged bivariate models
          href: articles/bivariate-nongaussian.html
        - text: Association between outcome pairs
          href: articles/cross-family.html
        - text: Julia engine (future support)
          href: articles/julia-engine.html
    tutorials:
      text: Tutorials
      menu:
        - text: Full introductory tutorial
          href: articles/drmTMB.html
        - text: When variance carries signal, Part 1
          href: articles/location-scale.html
        - text: When variance carries signal, Part 2
          href: articles/location-scale-scale.html
        - text: Robust continuous responses
          href: articles/robust-student.html
        - text: Count abundance and extra zeros
          href: articles/count-nbinom2.html
        - text: Proportions and success rates
          href: articles/proportion-beta-binomial.html
        - text: Meta-analysis with known sampling variances
          href: articles/meta-analysis.html
        - text: Structural dependence overview
          href: articles/structural-dependence.html
        - text: Animal models and relatedness
          href: articles/animal-models.html
        - text: Phylogenetic structured effects
          href: articles/phylogenetic-models.html
        - text: Two-tree phylogenetic interactions
          href: articles/bipartite-phylogenetic-interactions.html
        - text: Coordinate-spatial structured effects
          href: articles/spatial-models.html
        - text: Known-matrix relmat models
          href: articles/relmat-known-matrices.html
        - text: Structural dependence details
          href: articles/phylogenetic-spatial.html
        - text: Working with large data
          href: articles/large-data.html
    diagnostics:
      text: Diagnostics & Validation
      menu:
        - text: Errors, warnings, and convergence
          href: articles/convergence.html
        - text: Checking fitted models
          href: articles/model-workflow.html
        - text: Residual and distributional adequacy
          href: articles/distributional-outputs-and-adequacy.html
        - text: Figure gallery
          href: articles/figure-gallery.html
    developer:
      text: Developer Notes
      menu:
        - text: Formula grammar
          href: articles/formula-grammar.html
        - text: Adding families
          href: articles/adding-families.html
        - text: Implemented source map
          href: articles/source-map.html
        - text: Validating likelihoods and comparators
          href: articles/testing-likelihoods.html
        - text: Simulation evidence plot grammar
          href: articles/simulation-plot-grammar.html
        - text: Finish capability matrix
          href: https://github.com/itchyshin/drmTMB/blob/main/docs/design/168-r-julia-finish-capability-matrix.md

reference:
  - title: Package
    contents:
      - drmTMB-package
  - title: Model specification
    desc: Formula constructors, family objects, and status-marked model syntax.
    contents:
      - drm_formula
      - meta_V
      - mi
      - impute_model
      - meta_vcov_bivariate
      - beta
      - zero_one_beta
      - beta_binomial
      - cumulative_logit
      - categorical
      - student
      - skew_normal
      - lognormal
      - tweedie
      - nbinom2
      - truncated_nbinom2
      - biv_gaussian
      - biv_lognormal
      - biv_student
      - latent_normal
  - title: Structured-effect markers
    desc: Status-marked random-effect scale, structured covariance, and latent-correlation syntax; each reference page separates fitted routes from planned neighbours.
    contents:
      - random_effect_scale_formulas
      - animal
      - phylo
      - phylo_interaction
      - spatial
      - spatial_coords
      - make_mesh
      - relmat
      - corpair
  - title: Deprecated marker internals
    desc: Older deprecated formula markers kept out of the main reader path.
    contents:
      - meta_known_V
      - gr
  - title: Model fitting and post-fit tools
    desc: Fit, diagnose, summarize, predict, and simulate distributional models.
    contents:
      - starts_with("drmTMB")
      - drm_control
      - miss_control
      - drm_phylo_penalty
      - drm_phylo_penalty_sweep
      - check_drm
      - is_converged
      - confint.drmTMB
      - profile_targets
      - profile.drmTMB
      - corpairs
      - fitted.drmTMB
      - fixef
      - imputed
      - model-fit-extractors
      - marginal_parameters
      - prediction_grid
      - predict_parameters
      - predict.drmTMB
      - ranef
      - residuals.drmTMB
      - rho12
      - sigma.drmTMB
      - simulate.drmTMB
      - structured_effects
      - summary.drmTMB
      - weights.drmTMB
      - associate_pairs
      - association
      - biv_associate
      - vcov.drm_pair_association
      - confint.drm_pair_association
      - predict.drm_pair_association
  - title: Distributional outputs and adequacy
    desc: >
      A first-class fitted distribution for every family, plus the adequacy
      diagnostics and centile/exceedance outputs built on it (#747, #748).
    contents:
      - fitted_distribution
      - exceedance
      - centile_chart
      - worm_plot
      - qq_plot
  - title: Deferred Julia bridge compatibility
    desc: Compatibility methods for legacy Julia-engine objects; Julia fitting is not a current analysis route.
    contents:
      - confint.drmTMB_julia
      - predict.drmTMB_julia
      - summary.drmTMB_julia
      - rho_latent
      - summary.drmTMB_julia_xfam
      - vcov.drmTMB_julia_xfam
  - title: Visualization
    desc: Optional plotting helpers for post-fit tables. Exported plotting functions appear here.
    contents:
      - plot.profile.drmTMB
      - plot_corpairs
      - plot_parameter_surface

