# Temporary diagnostic branch: identify the file active in the timed-out 9/16
# installed-package shard. This workflow is not a release gate or replacement.
on:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  timed-installed-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      DRMTMB_TEST_SHARD: 9/16
      DRMTMB_TIMED_REPORTER: "true"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Record R and threading configuration
        run: |
          Rscript --vanilla -e 'sessionInfo(); cat("OMP_NUM_THREADS=", Sys.getenv("OMP_NUM_THREADS"), " OPENBLAS_NUM_THREADS=", Sys.getenv("OPENBLAS_NUM_THREADS"), "\n")'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
