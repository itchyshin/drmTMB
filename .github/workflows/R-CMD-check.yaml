on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but NEVER a run on main. A cancelled run on the
  # default branch leaves that merge with no completed evidence, and GitHub logs
  # it with the same "cancelled" string as a timeout -- so a merge sequence can
  # read green BY ABSENCE. Measured here 2026-09-03: run 33757335131 on main was
  # killed 2 min into each shard by the next merge, 6 minutes after it started.
  # PR runs stay cancellable; the next push to that PR re-runs them.
  # (gllvmTMB has had this since before the shard work; drmTMB had not.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Routine runs (pull_request, push to main) check Linux only to keep CI cheap.
  # The full ubuntu + macOS + windows matrix runs only for release tags (v*) and
  # on demand via workflow_dispatch -- e.g. before a CRAN submission, or to
  # exercise cross-OS portability of compiled TMB code on a specific branch.
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          FULL="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}"
          if [ "$FULL" = "true" ]; then
            # A release/tag run is the CRAN-shaped one: each OS runs the whole
            # suite in a single job (shard 0 == unsharded), exactly as before.
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"},{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"}],"shard":[0]}' >> "$GITHUB_OUTPUT"
          else
            # Routine runs shard the suite 4 ways. Measured 2026-09-03 on this
            # repo's own check log: of a 44 min check, `checking tests` alone was
            # 30m56s (10:59:14 -> 11:30:10), against 209s to install, 49s of
            # examples and 124s of vignettes. Tests are ~75% of the wall clock,
            # so they are the only part worth splitting -- cutting vignettes
            # would have bought about two minutes.
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"}],"shard":[1,2,3,4]}' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: os-matrix
    runs-on: ${{ matrix.config.os }}
    # Measured, not guessed. Six completed ubuntu jobs on 2026-08-04 ran
    # 43m35s / 43m51s / 44m34s / 44m36s / 45m49s / 46m34s -- a ~44-47 min suite.
    # The former 45 was INSIDE that band, so runs were a coin flip: main itself was
    # killed at 45.1 min (run 30847977891 at 95b8ea34e) and GitHub logged it as
    # "cancelled", the same string as a concurrency cancel, which is why it was
    # misread as concurrency for days. 75 leaves ~28 min over the observed maximum
    # -- room for runner variance and suite growth -- while still killing a genuinely
    # hung job in half the time the interim 120 allowed.
    timeout-minutes: 75

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.shard != 0 && format(' shard {0}/4', matrix.shard) || '' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.os-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # "k/4" on routine runs, empty on the shard 0 (release/tag) combos above.
      # tests/testthat.R treats an unset/empty value as "run everything", so a
      # local devtools::test() and the CRAN lane are both unaffected.
      DRMTMB_TEST_SHARD: ${{ matrix.shard != 0 && format('{0}/4', matrix.shard) || '' }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Files under tools/tests/ are listed explicitly rather than run via
      # `unittest discover`, so that adding one to CI is a deliberate act and a
      # guard cannot rejoin -- or silently leave -- without review. A guard that
      # no runner invokes is worse than no guard, because the evidence record
      # still credits it. See
      # docs/dev-log/after-task/2026-08-03-b4-ci-mc-0207-pin-drift.md.
      #
      # 6 of 9 run. (This count read "5 of 7" before Arc 7b: it had missed
      # test_b4_ci_guard.py, which already existed and was already wired. A
      # stale count in the comment whose whole purpose is to stop guards going
      # stale is worth correcting rather than propagating.)
      #
      # test_b4_ci_c2/c3/c4 are still EXCLUDED, for a reason that is
      # NOT the mc-0207 pin drift (that is fixed -- all four pass locally):
      # their check paths call selected_source(), which reads
      # `git show 574c1108e...:<ledger>` -- and SOURCE_COMMIT 574c1108e is not
      # on origin at all. It exists only on a local-only branch
      # (codex/lane-b-q1-preflight-admission), so no fetch can make it reachable
      # from a CI runner. c1 is wired because its check_current() was written
      # "without source-history access" and needs no such lookup; that is the
      # pattern c2/c3/c4 would have to adopt. Resolving this needs an owner
      # decision -- push the source branch to origin, or port c1's no-git path
      # to the other three -- and until then the exclusion stays named here
      # rather than hidden behind `discover`.
      #
      # test_profile_truth_gate.py (Arc 7b) sweeps the 31-cell profile contract
      # surface for interval LOCATION -- whether each retained interval actually
      # contains its DGP's true value. It is wired here in the same change that
      # created it, for the reason the pin-drift note above records. The
      # emit-profile-truth-manifest.R --check step guards the derived truth
      # manifest it reads: if a fixture builder's true value changes and the
      # manifest is not regenerated, that step fails rather than the gate
      # silently checking against a stale truth.
      - name: Validate generated capability ledger
        if: runner.os == 'Linux'
        run: |
          python3 tools/capability_ledger.py --check
          python3 -m unittest tools/tests/test_capability_ledger.py
          python3 -m unittest tools/tests/test_arc1_profile_reconcilers.py
          python3 -m unittest tools/tests/test_b3_q6_target_promotion.py
          python3 -m unittest tools/tests/test_b4_ci_guard.py
          python3 -m unittest tools/tests/test_b4_ci_c1.py
          python3 -m unittest tools/tests/test_profile_truth_gate.py
          Rscript --no-init-file tools/emit-profile-truth-manifest.R --check
          Rscript --no-init-file tools/check-capability-runtime.R

      # Prong B Tier 1 fence-integrity guard (docs/dev-log/handover/
      # 2026-08-03-prong-b-next-lane-brief.md). R/profile.R's profile-status
      # predicates decide, per random-effect target, whether
      # `confint(method = "profile")` may run at all. This guard checks that
      # decision surface directly rather than trusting a diff review: a
      # pure-R predicate-domain enumeration (no TMB fitting, sub-second) plus
      # a real drmTMB() fitted battery, both checked against a hard-coded
      # intended-outcome table (14 named routes open, zi_nbinom2 ordinary
      # sigma q1 and zero_one_beta structured mu/zoi/coi stay fenced). Run
      # after tools/check-capability-runtime.R so the TMB shared object it
      # just (re)built is already current -- this step then loads the
      # package in place with pkgload::load_all() and does not recompile.
      - name: Profile-fence integrity (Prong B Tier 1)
        if: runner.os == 'Linux'
        run: |
          Rscript --no-init-file tools/check-profile-fence-integrity.R

      # Evidence-citation guard. The equivalent assertion in
      # tests/testthat/test-estimator-surface-conformance.R CANNOT FAIL under
      # `R CMD check`: .Rbuildignore excludes ^docs$, so the conformance TSV is
      # absent from the built tarball and that test's skip_if_not() skips the
      # whole block. That is precisely why four citations rotted on main while
      # CI stayed green. This step runs from the SOURCE CHECKOUT, where docs/
      # exists. It reads files only -- no package load, no fits -- so it costs
      # milliseconds, and it sits before check-r-package deliberately: a broken
      # citation should fail the job in seconds, not after a 40-minute check.
      - name: Evidence citations resolve
        if: runner.os == 'Linux'
        run: |
          Rscript --no-init-file tools/check-evidence-citations.R

      # Julia bridge glue, mock-driven (#1081). No runner has Julia, so every
      # live engine test skips here and the suite's teardown line says the
      # bridge is UNTESTED. That line counts LIVE tests only: the marshalling
      # code paths (payload serialization, coef_labels, joint dispatch, xfam
      # routing, structured-RE fixtures) ARE executed by mock-driven
      # assertions in the files below -- measured 2026-09-04 without Julia:
      # 1212 expectations passed across these 11 files in 11.4 s. This step runs
      # exactly those files, prints the tally, and FAILS unless > 0 passed
      # with 0 failures and 0 errors, so a green run carries a counted claim
      # about the glue rather than silence. It is NOT live-engine evidence:
      # a mock that replaces the Julia call cannot see a signature mismatch
      # with DRM.jl; that stays with the local DRM_JL_PATH lane.
      # Runs after check-capability-runtime.R built the shared object, so
      # pkgload::load_all() here does not recompile. Placed BEFORE the receipt
      # step so a designed-red receipt (see below) never hides whether the
      # glue step ran. suppressMessages() drops the per-file teardown line
      # (tests/testthat/teardown-julia-bridge-summary.R) that would otherwise
      # print eleven times; the tally below is the one counted claim.
      - name: Julia bridge glue executes (mock-driven, no Julia)
        if: runner.os == 'Linux'
        env:
          NOT_CRAN: true
        run: |
          Rscript --no-init-file -e '
            suppressMessages(pkgload::load_all(".", quiet = TRUE))
            files <- c(
              "test-julia-bridge.R", "test-bridge-payload-serialization.R",
              "test-julia-joint-call.R", "test-julia-joint-dispatch.R",
              "test-julia-bridge-coef-labels.R", "test-julia-inference.R",
              "test-julia-structured-inference.R", "test-julia-joint-finite-prepare.R",
              "test-structured-re-bridge-fixtures.R", "test-julia-objective-at-bridge.R",
              "test-xfam-bridge.R"
            )
            tally <- c(passed = 0L, failed = 0L, error = 0L, skipped = 0L)
            for (f in files) {
              res <- as.data.frame(suppressMessages(testthat::test_file(
                file.path("tests/testthat", f), reporter = "silent", package = "drmTMB"
              )))
              row <- c(passed = sum(res$passed), failed = sum(res$failed),
                       error = sum(res$error), skipped = sum(res$skipped))
              cat(sprintf("%-42s passed=%4d failed=%d error=%d skipped=%d\n",
                          f, row[["passed"]], row[["failed"]], row[["error"]], row[["skipped"]]))
              tally <- tally + row
            }
            cat(sprintf(
              "Julia bridge glue (mock-driven, no Julia): %d expectations passed, %d failed, %d errors, %d live skipped across %d files\n",
              tally[["passed"]], tally[["failed"]], tally[["error"]], tally[["skipped"]], length(files)
            ))
            if (tally[["passed"]] == 0L || tally[["failed"]] > 0L || tally[["error"]] > 0L) {
              stop("mock-driven bridge glue did not execute cleanly (see tally above)")
            }
          '

      # Receipt staleness MOVED 2026-09-06 to .github/workflows/receipt-staleness.yaml,
      # which runs on push to main. It ran here, on the PR merge preview, and so
      # re-staled EVERY open PR whenever main moved -- including PRs touching no R/
      # file (#1296 changed one test and went red on it). Measured: 16 merges in one
      # afternoon against four live PRs. The guard's claim -- "a receipt must not
      # drift from the source it certifies" -- is about MAIN, which is where drift
      # enters and where it is now checked, on every merge, in ~2 minutes.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # THE BLIND SPOT THIS CLOSES. Every job above checks the built TARBALL, and
  # .Rbuildignore removes tools/, docs/, pkgdown/, bench/, _pkgdown.yml and the
  # simulation-results tree under inst/sim. A test whose premise is such a path hits
  # its own skip_if(!file.exists(...)) and SKIPS -- and testthat prints a skip
  # inside the same green summary as a pass. The premise is absent because of
  # the BUILD, not the environment, so that skip is permanent: those tests have
  # never once run in CI.
  #
  # Measured at origin/main df1aca4a6 by running the affected files twice, once
  # in the source tree and once inside the extracted `R CMD build` tarball:
  # 35 files change behaviour, 24,348 passing assertions collapse to 855, and
  # 24 of the 35 contribute ZERO assertions to the tarball run. Two user-facing
  # defects reached main inside that gap -- the reader-contract linter had
  # silently stopped policing six vignettes (#1207) and nine exported functions
  # were missing from the printable cheatsheets (#1208) -- and both were found
  # by a full source-tree run, not by CI.
  #
  # This is deliberately NOT a fifth shard and NOT a second `R CMD check`: it is
  # one ubuntu job that loads the package in place with pkgload::load_all() and
  # runs only the derived subset. Measured locally (macOS, R 4.6.0, warm object
  # files): 3m42s for all 35 files. The runner also pays a dependency install
  # and one TMB compile, so budget well under the 75 the shards get.
  #
  # The file set is DERIVED from .Rbuildignore at run time and cross-checked
  # against tools/source-tree-tests.txt, so a new test with a build-excluded
  # premise cannot quietly join the blind spot, and an existing one cannot
  # quietly leave the lane.
  source-tree-tests:
    runs-on: ubuntu-latest
    name: source-tree tests (blind spot)
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      # Fails in milliseconds, before the compile, if the derived set and the
      # committed manifest disagree -- a stale manifest is how this guard would
      # rot, and it should not cost a build to say so.
      - name: Source-tree test manifest is current
        run: Rscript --no-init-file tools/run-source-tree-tests.R --check

      - name: Run the tests R CMD check cannot reach
        run: Rscript --no-init-file tools/run-source-tree-tests.R
