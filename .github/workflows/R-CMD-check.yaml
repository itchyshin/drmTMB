on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routine runs (pull_request, push to main) check Linux only to keep CI cheap.
  # The full ubuntu + macOS + windows matrix runs only for release tags (v*) and
  # on demand via workflow_dispatch -- e.g. before a CRAN submission, or to
  # exercise cross-OS portability of compiled TMB code on a specific branch.
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          FULL="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}"
          if [ "$FULL" = "true" ]; then
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"},{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"}]}' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: os-matrix
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.os-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # tools/tests/ has seven test_*.py files; only three are wired in below.
      # test_b4_ci_c1.py through test_b4_ci_c4.py are deliberately EXCLUDED:
      # all four pin docs/dev-log/dashboard/capability-ledger/cells.tsv rows
      # for mc-0182/mc-0183/mc-0207/mc-0269 (their EXCLUDED_IDS) against a
      # frozen BASE_COMMIT, and PR #905's Arc 4b split legitimately changed
      # mc-0207's row -- so all four fail --check/--check-current even on
      # unmodified main today (confirmed in a clean worktree, independent of
      # any other change). Reconciling them needs an owner decision on
      # whether the reviewed split is an approved base change for the B4-CI
      # C1-C4 closures; see docs/dev-log/after-task/2026-08-03-b4-ci-mc-0207-
      # pin-drift.md. Do not switch this to `unittest discover` until that
      # decision lands -- discovery would silently re-include all four.
      - name: Validate generated capability ledger
        if: runner.os == 'Linux'
        run: |
          python3 tools/capability_ledger.py --check
          python3 -m unittest tools/tests/test_capability_ledger.py
          python3 -m unittest tools/tests/test_arc1_profile_reconcilers.py
          python3 -m unittest tools/tests/test_b3_q6_target_promotion.py
          Rscript --no-init-file tools/check-capability-runtime.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
