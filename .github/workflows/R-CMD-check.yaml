on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routine runs (pull_request, push to main) check Linux only to keep CI cheap.
  # The full ubuntu + macOS + windows matrix runs only for release tags (v*) and
  # on demand via workflow_dispatch -- e.g. before a CRAN submission, or to
  # exercise cross-OS portability of compiled TMB code on a specific branch.
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          FULL="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}"
          if [ "$FULL" = "true" ]; then
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"},{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"config":[{"os":"ubuntu-latest","r":"release"}]}' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: os-matrix
    runs-on: ${{ matrix.config.os }}
    # Measured, not guessed. Six completed ubuntu jobs on 2026-08-04 ran
    # 43m35s / 43m51s / 44m34s / 44m36s / 45m49s / 46m34s -- a ~44-47 min suite.
    # The former 45 was INSIDE that band, so runs were a coin flip: main itself was
    # killed at 45.1 min (run 30847977891 at 95b8ea34e) and GitHub logged it as
    # "cancelled", the same string as a concurrency cancel, which is why it was
    # misread as concurrency for days. 75 leaves ~28 min over the observed maximum
    # -- room for runner variance and suite growth -- while still killing a genuinely
    # hung job in half the time the interim 120 allowed.
    timeout-minutes: 75

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.os-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Files under tools/tests/ are listed explicitly rather than run via
      # `unittest discover`, so that adding one to CI is a deliberate act and a
      # guard cannot rejoin -- or silently leave -- without review. A guard that
      # no runner invokes is worse than no guard, because the evidence record
      # still credits it. See
      # docs/dev-log/after-task/2026-08-03-b4-ci-mc-0207-pin-drift.md.
      #
      # 6 of 9 run. (This count read "5 of 7" before Arc 7b: it had missed
      # test_b4_ci_guard.py, which already existed and was already wired. A
      # stale count in the comment whose whole purpose is to stop guards going
      # stale is worth correcting rather than propagating.)
      #
      # test_b4_ci_c2/c3/c4 are still EXCLUDED, for a reason that is
      # NOT the mc-0207 pin drift (that is fixed -- all four pass locally):
      # their check paths call selected_source(), which reads
      # `git show 574c1108e...:<ledger>` -- and SOURCE_COMMIT 574c1108e is not
      # on origin at all. It exists only on a local-only branch
      # (codex/lane-b-q1-preflight-admission), so no fetch can make it reachable
      # from a CI runner. c1 is wired because its check_current() was written
      # "without source-history access" and needs no such lookup; that is the
      # pattern c2/c3/c4 would have to adopt. Resolving this needs an owner
      # decision -- push the source branch to origin, or port c1's no-git path
      # to the other three -- and until then the exclusion stays named here
      # rather than hidden behind `discover`.
      #
      # test_profile_truth_gate.py (Arc 7b) sweeps the 31-cell profile contract
      # surface for interval LOCATION -- whether each retained interval actually
      # contains its DGP's true value. It is wired here in the same change that
      # created it, for the reason the pin-drift note above records. The
      # emit-profile-truth-manifest.R --check step guards the derived truth
      # manifest it reads: if a fixture builder's true value changes and the
      # manifest is not regenerated, that step fails rather than the gate
      # silently checking against a stale truth.
      - name: Validate generated capability ledger
        if: runner.os == 'Linux'
        run: |
          python3 tools/capability_ledger.py --check
          python3 -m unittest tools/tests/test_capability_ledger.py
          python3 -m unittest tools/tests/test_arc1_profile_reconcilers.py
          python3 -m unittest tools/tests/test_b3_q6_target_promotion.py
          python3 -m unittest tools/tests/test_b4_ci_guard.py
          python3 -m unittest tools/tests/test_b4_ci_c1.py
          python3 -m unittest tools/tests/test_profile_truth_gate.py
          Rscript --no-init-file tools/emit-profile-truth-manifest.R --check
          Rscript --no-init-file tools/check-capability-runtime.R

      # Prong B Tier 1 fence-integrity guard (docs/dev-log/handover/
      # 2026-08-03-prong-b-next-lane-brief.md). R/profile.R's profile-status
      # predicates decide, per random-effect target, whether
      # `confint(method = "profile")` may run at all. This guard checks that
      # decision surface directly rather than trusting a diff review: a
      # pure-R predicate-domain enumeration (no TMB fitting, sub-second) plus
      # a real drmTMB() fitted battery, both checked against a hard-coded
      # intended-outcome table (14 named routes open, zi_nbinom2 ordinary
      # sigma q1 and zero_one_beta structured mu/zoi/coi stay fenced). Run
      # after tools/check-capability-runtime.R so the TMB shared object it
      # just (re)built is already current -- this step then loads the
      # package in place with pkgload::load_all() and does not recompile.
      - name: Profile-fence integrity (Prong B Tier 1)
        if: runner.os == 'Linux'
        run: |
          Rscript --no-init-file tools/check-profile-fence-integrity.R

      # Evidence-citation guard. The equivalent assertion in
      # tests/testthat/test-estimator-surface-conformance.R CANNOT FAIL under
      # `R CMD check`: .Rbuildignore excludes ^docs$, so the conformance TSV is
      # absent from the built tarball and that test's skip_if_not() skips the
      # whole block. That is precisely why four citations rotted on main while
      # CI stayed green. This step runs from the SOURCE CHECKOUT, where docs/
      # exists. It reads files only -- no package load, no fits -- so it costs
      # milliseconds, and it sits before check-r-package deliberately: a broken
      # citation should fail the job in seconds, not after a 40-minute check.
      - name: Evidence citations resolve
        if: runner.os == 'Linux'
        run: |
          Rscript --no-init-file tools/check-evidence-citations.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
