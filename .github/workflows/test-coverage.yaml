# Test coverage producer for drmTMB.
#
# Derived from the r-lib/actions test-coverage example and the owner's
# sanctioned pigauto split: this job MEASURES coverage with covr. It does
# not upload to Codecov and must not hold id-token: write. Trusted upload
# lives in codecov-upload.yaml and runs only after a successful main-branch
# producer. Pull requests never obtain upload credentials.
#
# Shards reuse DRMTMB_TEST_SHARD="k/4" so the four jobs partition the suite
# exactly once (tests/testthat/helper-shard-util.R). One OS, one R version:
# repeating Ubuntu/macOS/Windows or attaching coverage to R-CMD-check would
# double-count. Existing R-CMD-check shards are unchanged and do not upload
# coverage.
#
# pull_request_target is deliberately absent. No CODECOV_TOKEN is read or
# invented. GITHUB_PAT is the standard r-lib GitHub token for package
# installs, not a Codecov token.
#
# Push-to-main is an exception to the R-CMD-check house rule: Codecov OIDC
# upload is main-only, so the producer must run on main to create the
# trusted artifact. This is a coverage job, not a second R CMD check.
#
# pull_request checkouts GitHub's merge commit (GITHUB_SHA), not the branch
# head. Record both: coverage_commit/checkout_sha is what tests ran;
# branch_head is github.event.pull_request.head.sha. Run 42517999771 tested
# merge e45d4241c6a21a534c957fff8d0d32452358ce20, not head 7acb39384.
#
# covr runs tools::testInstalledPackage from
# <lib>/drmTMB/drmTMB-tests/testthat. Source-path guards
# (drm_src_path / drm_pkg_path) already resolve the Unix Rcheck layout
# 00_pkg_src/drmTMB. The producer plants that layout at the covr library
# root so those assertions still run. Do not skip_on_covr or rewrite them.
# From that cwd ../../DESCRIPTION is the installed package itself;
# drm_pkg_path rejects roots with Meta/package.rds so callers that
# pkgload::load_all() the result get the planted source tree (run
# 42526163025, shard 1, test-newton-polish-guard.R DLLInfo error).

on:
  push:
    branches: [main, master]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/test-coverage.yaml"
      - ".github/workflows/codecov-upload.yaml"
      - "codecov.yml"
      - "tools/covr-source-tree-layout.sh"
      - "tools/covr-julia-bridge-testthat.R"
      - "tools/covr-plant-julia-bridge-testthat.sh"
      - "tools/ci-install-drmodels-julia.sh"
      - "tools/covr-julia-bridge-include.txt"
      - "tools/run-covr-julia-bridge-coverage.R"
  pull_request:
    branches: [main, master]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/test-coverage.yaml"
      - ".github/workflows/codecov-upload.yaml"
      - "codecov.yml"
      - "tools/covr-source-tree-layout.sh"
      - "tools/covr-julia-bridge-testthat.R"
      - "tools/covr-plant-julia-bridge-testthat.sh"
      - "tools/ci-install-drmodels-julia.sh"
      - "tools/covr-julia-bridge-include.txt"
      - "tools/run-covr-julia-bridge-coverage.R"
      - "tools/ci-bootstrap-juliacall-for-coverage.R"
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-24.04
    # Timeout evidence from run 42517999771 (head 7acb39384, tested merge
    # e45d4241c6a21a534c957fff8d0d32452358ce20): shards 2/3 spent ~87 min
    # in "Test coverage" (20:04Z–21:31Z) then failed on missing src/docs
    # paths; shards 1/4 were cancelled at 21:32:14Z, the 90-minute job
    # timeout, still in that step. Setup is ~2 min. 90 minutes is below
    # the measured instrumented-test duration plus cobertura. 120 minutes
    # is 87 + setup + aggregation buffer. Whether 120 is enough for the
    # slowest shard is unknown: shards 1/4 had not finished tests at 88
    # minutes of that step. This is not a timeout-only fix; the 00_pkg_src
    # plant is the shard 2/3 path repair.
    # 120 was not enough: run 42624436768 (head c3b5c07d8) cancelled shard
    # 4/4 at the 120-minute timeout still in tests (13:24Z-15:20Z), after
    # 106.8 min for the same shard in run 42526163025. The same shard spread
    # is 65 vs 109 min for shard 2/4 across those runs, so runner speed, not
    # a hang, sets the tail. 180 matches R-CMD-check's unsharded job.
    timeout-minutes: 180
    name: ubuntu-24.04 (release) coverage shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      DRMTMB_TEST_SHARD: ${{ format('{0}/4', matrix.shard) }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Record tested commit
        run: |
          checkout_sha=$(git rev-parse HEAD)
          branch_head='${{ github.event.pull_request.head.sha || github.sha }}'
          {
            echo "checkout_sha=${checkout_sha}"
            echo "coverage_commit=${checkout_sha}"
            echo "github_sha=${GITHUB_SHA}"
            echo "branch_head=${branch_head}"
            echo "pr_head=${{ github.event.pull_request.head.sha }}"
            echo "shard=${DRMTMB_TEST_SHARD}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            if [ -n "${branch_head}" ] && [ "${checkout_sha}" != "${branch_head}" ]; then
              echo "sha_note=pull_request_merge_sha_is_not_branch_head"
            fi
          } | tee coverage-identity.txt

      - name: Plant Rcheck 00_pkg_src for covr tests
        run: bash tools/covr-source-tree-layout.sh "${{ runner.temp }}/package" "${{ github.workspace }}"

      - name: Test coverage
        run: |
          shard <- Sys.getenv("DRMTMB_TEST_SHARD")
          if (!nzchar(shard)) {
            stop("DRMTMB_TEST_SHARD must be set so coverage shards partition tests")
          }
          install_path <- file.path(
            normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
            "package"
          )
          pkg_root <- normalizePath(".", winslash = "/", mustWork = TRUE)
          checkout_sha <- system("git rev-parse HEAD", intern = TRUE)
          cat(sprintf("coverage_commit=%s\n", checkout_sha))
          cat(sprintf("checkout_sha=%s\n", checkout_sha))
          cat(sprintf("github_sha=%s\n", Sys.getenv("GITHUB_SHA")))
          cat(sprintf("branch_head=%s\n", Sys.getenv("DRMTMB_BRANCH_HEAD")))
          cat(sprintf("DRMTMB_TEST_SHARD=%s\n", shard))
          layout_rc <- system2(
            "bash",
            c("tools/covr-source-tree-layout.sh", install_path, pkg_root)
          )
          if (!identical(layout_rc, 0L)) {
            stop("failed to plant 00_pkg_src for covr tests")
          }
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            type = "tests",
            install_path = install_path
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf(
            paste0(
              "shard_percent_coverage=%.4f (shard %s only; Codecov merges ",
              "complementary shards after a trusted main upload)\n"
            ),
            pct, shard
          ))
          writeLines(
            sprintf("shard_percent_coverage=%.4f", pct),
            "coverage-percent.txt"
          )
          covr::to_cobertura(cov, filename = "cobertura.xml")
        env:
          DRMTMB_BRANCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: Rscript {0}

      - name: Save pull-request coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-coverage-shard-${{ matrix.shard }}
          path: |
            cobertura.xml
            coverage-identity.txt
            coverage-percent.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save coverage report for trusted upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-coverage-shard-${{ matrix.shard }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/package

  # Live Julia bridge coverage: separate from the four R shards so the slowest
  # shard budget (~180 min) is not spent on JuliaCall + DRModels.jl setup.
  # Exercises test-julia-*.R with DRMTMB_JULIA_TESTS=true; merges at Codecov
  # under flag julia-bridge (codecov-upload.yaml).
  julia-bridge-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    name: ubuntu-24.04 (release) julia-bridge coverage

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      DRMTMB_JULIA_TESTS: true
      DRMTMB_COVERAGE_JULIA_INCLUDE: ${{ github.workspace }}/tools/covr-julia-bridge-include.txt
      DRMTMB_COVERAGE_SKIP_FRAC_MAX: "0.10"
      DRMODELS_JL_PATH: ${{ github.workspace }}/DRModels.jl
      DRM_JL_PATH: ${{ github.workspace }}/DRModels.jl
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      JULIA_NUM_THREADS: 1
      JULIA_PKG_PRECOMPILE_AUTO: "0"

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/checkout@v6.0.2
        with:
          repository: itchyshin/DRModels.jl
          path: DRModels.jl
          ref: main
          persist-credentials: false

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - uses: julia-actions/cache@v2

      - name: Instantiate DRModels.jl
        run: bash tools/ci-install-drmodels-julia.sh "${{ github.workspace }}/DRModels.jl"

      - name: Record resolved DRModels.jl commit
        run: |
          drmodels_sha=$(git -C DRModels.jl rev-parse HEAD)
          echo "drmodels_jl_sha=${drmodels_sha}"
          echo "DRMODELS_JL_SHA=${drmodels_sha}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::JuliaCall
          needs: coverage

      - name: Preinstall Suppressor for JuliaCall setup.jl
        shell: bash
        run: julia --startup-file=no -e 'using Pkg; Pkg.add("Suppressor"); using Suppressor'

      - name: Record tested commit
        run: |
          checkout_sha=$(git rev-parse HEAD)
          branch_head='${{ github.event.pull_request.head.sha || github.sha }}'
          drmodels_sha=$(git -C DRModels.jl rev-parse HEAD)
          {
            echo "checkout_sha=${checkout_sha}"
            echo "coverage_commit=${checkout_sha}"
            echo "github_sha=${GITHUB_SHA}"
            echo "branch_head=${branch_head}"
            echo "pr_head=${{ github.event.pull_request.head.sha }}"
            echo "lane=julia-bridge"
            echo "drmodels_jl_sha=${drmodels_sha}"
            echo "drmodels_jl_path=${DRMODELS_JL_PATH}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            if [ -n "${branch_head}" ] && [ "${checkout_sha}" != "${branch_head}" ]; then
              echo "sha_note=pull_request_merge_sha_is_not_branch_head"
            fi
          } | tee coverage-identity.txt

      - name: Plant Rcheck 00_pkg_src for covr tests
        run: bash tools/covr-source-tree-layout.sh "${{ runner.temp }}/package" "${{ github.workspace }}"

      - name: Test coverage (Julia bridge)
        run: Rscript tools/run-covr-julia-bridge-coverage.R

      - name: Save pull-request coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-coverage-julia-bridge
          path: |
            cobertura.xml
            coverage-identity.txt
            coverage-percent.txt
            coverage-tests.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save coverage report for trusted upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-coverage-julia-bridge
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures-julia-bridge
          path: ${{ runner.temp }}/package
