on:
  # NOT on every successful main check any more. Measured 2026-09-03: each run is
  # 10-16 min and the concurrency group below deliberately QUEUES rather than
  # cancels (so a Pages deploy is never killed mid-flight) -- so on a day with
  # ~100 merges the site rebuild becomes a serial backlog that is always behind
  # and never useful. A daily build plus tags plus on-demand keeps the published
  # site at most a day stale, and exactly current at every release.
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 11 * * *"   # daily, after the overnight lanes have landed
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown
  # A tag build and a scheduled build can coincide. Queue them so an
  # in-progress Pages deployment is not cancelled before `deploy`.
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - uses: actions/configure-pages@v6.0.0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Fix favicon MIME markup
        run: Rscript tools/fix-pkgdown-favicon-mime.R pkgdown-site

      - name: Fix reference example alt text
        run: Rscript tools/fix-pkgdown-reference-alt.R pkgdown-site

      - name: Strip internal-only pages
        continue-on-error: true
        run: Rscript tools/strip-pkgdown-internal-pages.R pkgdown-site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pkgdown-site

  deploy:
    # schedule/dispatch run on the default branch; a tag build is a release.
    if: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'main' || github.ref_name == 'master' }}
    needs: pkgdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
