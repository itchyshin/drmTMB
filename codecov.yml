# CI line coverage of R (and compiled src when gcov is present).
# This is not interval-coverage simulation evidence.
# Comments stay off until a trusted main-branch upload exists.
comment: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: julia-bridge
      carryforward: true

ignore:
  - "tests/**/*"
  - "vignettes/**/*"
  - "inst/**/*"
  - "tools/**/*"
